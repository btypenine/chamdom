name: bt-lab
on:
  push:
    branches: [bt-lab]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pyjwt
      - run: mkdir -p results && python -u tools/bt_lab.py | tee results/bt_out.txt && mv bt_summary.json results/
      - name: 결과 저장 (bt-lab 브랜치, 재실행 안 함)
        run: |
          git config user.name "bt-lab"; git config user.email "bt-lab@users.noreply.github.com"
          git add results && git commit -m "bt-lab 결과 [skip ci]" && git push
